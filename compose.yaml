# 个人博客的独立部署单元
#
#   docker compose up -d
#
# 这个文件属于「个人博客」项目，和团队博客的 compose 完全独立：
# 不同的目录、不同的容器名、不同的端口。
name: personal-blog

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
